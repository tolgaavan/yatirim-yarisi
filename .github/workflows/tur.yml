name: Yatırım turu

# Program 30 dakikada bir uyanır; yalnızca kontrol zamanı gelmiş portföyleri çalıştırır
# (kontrol zamanını her portföy için model kendisi seçer). GitHub zamanlayıcısı birkaç dakika gecikebilir.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Hangi model"
        type: choice
        options: [hepsi, deepseek, chatgpt, claude]
        default: hepsi
      portfoy:
        description: "Hangi portföy"
        type: choice
        options: [hepsi, uzun_riskli, uzun_risksiz, orta_riskli, orta_risksiz, kisa]
        default: hepsi
      zorla:
        description: "Zamanı gelmemiş olsa da şimdi sor"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: yatirim-turu
  cancel-in-progress: false

jobs:
  tur:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .
      - name: Tur
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: >-
          python -m bot.calistir
          --model "${{ inputs.model || 'hepsi' }}"
          --portfoy "${{ inputs.portfoy || 'hepsi' }}"
          ${{ inputs.zorla && '--zorla' || '' }}
      - name: Sonucu kaydet
        if: always()
        run: |
          git config user.name "yatirim-botu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "Tur: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
