# Gerçek modellerle deneme: yarışın verisine dokunmaz, boş bir klasörde çalışır ve sonucu yalnızca
# indirilebilir dosya (artifact) olarak bırakır. Commit yapmaz. Yalnızca elle çalıştırılır.
name: Deneme (yarışa sayılmaz)

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Hangi model"
        type: choice
        options: [hepsi, deepseek, chatgpt, claude]
        default: hepsi
      portfoy:
        description: "Hangi portföy"
        type: choice
        options: [kisa, uzun_riskli, uzun_risksiz, orta_riskli, orta_risksiz, hepsi]
        default: kisa
      haftalik:
        description: "Ardından haftalık değerlendirme de yazdır"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deneme:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      YATIRIM_CIKTI: /tmp/deneme-cikti
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .
      - name: Tur
        run: python -m bot.calistir --zorla --model "${{ inputs.model }}" --portfoy "${{ inputs.portfoy }}"
      - name: Haftalık değerlendirme
        if: inputs.haftalik
        run: python -m bot.calistir --haftalik --model "${{ inputs.model }}" --portfoy "${{ inputs.portfoy }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deneme-cikti
          path: /tmp/deneme-cikti
