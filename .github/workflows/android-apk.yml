# Telefon uygulamasının Android APK'sı. Ekran (docs/index.html) APK'nın içine konur; internetten
# yalnızca veri çekilir ve son veri telefonda saklanır. Yalnızca elle çalıştırılır.
# İmza için APK_IMZA_B64 ve APK_IMZA_SIFRESI gizli bilgileri gerekir; kullanıcının isteğiyle
# derlemeden sonra silinir. Anahtar bilgisayarda durur (aynı imza = telefonda üzerine güncelleme).
name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: İmza dosyasını hazırla
        env:
          IMZA_DOSYASI_B64: ${{ secrets.APK_IMZA_B64 }}
        run: echo "$IMZA_DOSYASI_B64" | base64 --decode > "$RUNNER_TEMP/yatirim.jks"
      - name: Ekranı APK'ya koy
        run: |
          mkdir -p android/app/src/main/assets
          cp docs/ikon-*.png docs/manifest.webmanifest android/app/src/main/assets/
          sed '0,/<script>/s##<script>window.VERI_ADRESI = "https://tolgaavan.github.io/yatirim-yarisi/veri/ozet.json";</script>\n<script>#' \
            docs/index.html > android/app/src/main/assets/index.html
          grep -q "VERI_ADRESI = " android/app/src/main/assets/index.html
      - name: APK derle
        working-directory: android
        env:
          IMZA_DOSYASI: ${{ runner.temp }}/yatirim.jks
          IMZA_SIFRESI: ${{ secrets.APK_IMZA_SIFRESI }}
        run: gradle --no-daemon assembleRelease
      - name: Dosya adı
        run: cp android/app/build/outputs/apk/release/app-release.apk "yatirim-yarisi-1.0.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: yatirim-yarisi-apk
          path: yatirim-yarisi-*.apk
      - name: Sürüm sayfasına koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk yatirim-yarisi-*.apk --title "Android uygulaması" \
            --notes "Telefona kurmak için .apk dosyasını indirip aç. Önceki sürüm yüklüyse üzerine güncellenir."
